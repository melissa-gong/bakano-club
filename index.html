<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<meta name="robots" content="noindex">
<title>Club Bakano · Mi tarjeta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231d1d1b'/%3E%3Cpath d='M50 14l10.6 21.5 23.7 3.4-17.1 16.7 4 23.6L50 68 28.8 79.2l4-23.6L15.7 38.9l23.7-3.4z' fill='%2376b82a'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231d1d1b'/%3E%3Cpath d='M50 14l10.6 21.5 23.7 3.4-17.1 16.7 4 23.6L50 68 28.8 79.2l4-23.6L15.7 38.9l23.7-3.4z' fill='%2376b82a'/%3E%3C/svg%3E">
<style>
  :root{
    --negro:#1d1d1b; --acento:#76b82a; --acento2:#9bd655;
    --fondo:#121211; --tinta:#fff; --suave:rgba(255,255,255,.72); --linea:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--tinta);
    background:radial-gradient(120% 70% at 50% 0%,#2b2b28 0%,var(--fondo) 60%) fixed; background-color:var(--fondo);
    display:flex; justify-content:center; padding:18px 16px 32px;
  }
  main{width:100%; max-width:480px}
  .marca{text-align:center; font-weight:800; letter-spacing:.06em; color:var(--acento); font-size:13px; text-transform:uppercase; margin:2px 0 14px}

  /* ---------- tarjeta horizontal (proporción de tarjeta de crédito) ---------- */
  .tarjeta{
    position:relative; overflow:hidden; width:100%; aspect-ratio:1.586; border-radius:18px;
    padding:4.2% 4.6%; display:grid; grid-template-columns:1fr auto; gap:3.5%;
    background:linear-gradient(135deg,var(--negro) 0%,var(--negro) 45%,#121211 100%);
    box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2);
    border:1px solid rgba(118,184,42,.6); container-type:inline-size;
  }
  .tarjeta::before{content:""; position:absolute; right:-18%; top:-45%; width:70%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle,rgba(118,184,42,.28),transparent 65%); pointer-events:none}
  .tarjeta::after{content:""; position:absolute; left:-40%; top:0; width:35%; height:100%; transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); animation:brillo 5s ease-in-out infinite; pointer-events:none}
  @keyframes brillo{0%,62%{left:-40%}100%{left:130%}}
  .izq{position:relative; z-index:1; display:flex; flex-direction:column; min-width:0}
  .logo{display:block; width:44cqw; height:auto; margin:-1cqw 0 0 -1.2cqw}
  .club{font-size:2.6cqw; font-weight:800; letter-spacing:.16em; color:var(--acento); line-height:1; white-space:nowrap; margin-top:1cqw}
    .nombre{font-size:5.6cqw; font-weight:800; margin-top:auto; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .estado{display:inline-block; margin-top:1.2cqw; font-size:2.5cqw; font-weight:800; letter-spacing:.08em; padding:.8cqw 2cqw; border-radius:99px;
    background:var(--acento); color:#0f1f05; align-self:flex-start}
  .estado.baja{background:rgba(255,255,255,.18); color:#fff}
  .estrellas{display:flex; gap:1.6cqw; margin-top:2.6cqw}
  .estrellas svg{width:7.4cqw; height:7.4cqw; display:block}
  .estrellas .llena path{fill:var(--acento); stroke:var(--acento2)}
  .estrellas .vacia path{fill:rgba(0,0,0,.15); stroke:rgba(255,255,255,.4)}
  .estrellas .nueva{animation:pop .6s ease-out both}
  @keyframes pop{0%{transform:scale(.3); opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1); opacity:1}}
  .vence{font-size:2.5cqw; color:rgba(255,255,255,.75); margin-top:1.8cqw; letter-spacing:.03em}
  .der{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4cqw}
  .qr{background:#fff; border-radius:2.4cqw; padding:1.6cqw; width:33cqw; aspect-ratio:1; display:grid; place-items:center; box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .qr svg{width:100%; height:100%; display:block}
  .qr-txt{font-size:2.2cqw; color:rgba(255,255,255,.8); letter-spacing:.08em; text-transform:uppercase; font-weight:700}

  /* ---------- Green y Black ---------- */
  .tarjeta.green{background:linear-gradient(135deg,#4d9a1c 0%,#2f6a12 48%,#163d07 100%); border-color:rgba(190,240,130,.75)}
  .tarjeta.green::before{background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
  .tarjeta.green .club{color:#eaffd0}
  .tarjeta.green .estado{background:#fff; color:#173a07}
  .tarjeta.green .estrellas .llena path{fill:#fff; stroke:#eaffd0}
  .tarjeta.green .estrellas .vacia path{fill:rgba(0,0,0,.18); stroke:rgba(255,255,255,.55)}
  .tarjeta.green .vence,.tarjeta.green .qr-txt{color:rgba(255,255,255,.85)}
  .tarjeta.black{background:linear-gradient(135deg,#34342f 0%,#121211 45%,#000 100%); border-color:rgba(220,220,210,.55)}
  .tarjeta.black::before{background:radial-gradient(circle,rgba(118,184,42,.30),transparent 65%)}
  .tarjeta.black::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
  .tarjeta.black .club{background:linear-gradient(90deg,#f4f4ee,#9a9a92,#f4f4ee); -webkit-background-clip:text; background-clip:text; color:transparent}
  .tarjeta.black .estado{background:linear-gradient(90deg,#e8e8e2,#a9a9a1); color:#111}
  .ahorro{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .ahorro .grande{font-size:30px; font-weight:900; color:var(--acento2)}
  .ahorro span{color:var(--suave); font-size:14px}
  .vence .sdo{color:#fff; font-size:3cqw}
  .mini{color:var(--suave); font-size:13px; margin:8px 0 0; line-height:1.4}
  .mini b{color:#fff}
  .caja .barra{margin-top:10px}

  /* ---------- debajo de la tarjeta ---------- */
  .mensaje{font-size:16px; font-weight:700; margin:18px 2px 10px; line-height:1.4}
  .mensaje b{color:var(--acento)}
  .barra{height:8px; border-radius:99px; background:rgba(0,0,0,.3); overflow:hidden}
  .barra i{display:block; height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--acento),var(--acento2)); transition:width 1s ease}
  .plazo{display:flex; justify-content:space-between; color:var(--suave); font-size:12px; margin-top:6px}
  .caja{margin-top:16px; border-radius:18px; padding:16px 18px; background:rgba(255,255,255,.06); border:1px solid var(--linea)}
  .caja h2{margin:0 0 10px; font-size:15px; color:var(--acento); font-weight:800}
  .regalo{display:flex; align-items:center; gap:12px}
  .regalo .num{font-size:28px; font-weight:900; min-width:44px; text-align:center}
  .regalo p{margin:0; color:var(--suave); font-size:14px; line-height:1.35}
  .regalo p b{color:#fff}
  ul{margin:0; padding:0; list-style:none; display:grid; gap:9px}
  li{display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.35; color:var(--suave)}
  li span:first-child{flex:none; width:22px; text-align:center}
  li b{color:#fff}
  li .pt svg{width:17px; height:17px; margin-top:1px}
  li .pt path{fill:var(--acento); stroke:var(--acento2)}
  .pie{text-align:center; color:rgba(255,255,255,.55); font-size:12px; margin-top:18px; line-height:1.6}
  .aviso{grid-column:1/-1; display:flex; flex-direction:column; justify-content:center; text-align:center; position:relative; z-index:1}
  .aviso h1{margin:0 0 8px; font-size:6cqw; color:var(--acento)}
  .aviso p{margin:0; color:var(--suave); font-size:3.6cqw; line-height:1.45}

  /* ---------- modo verificación (lo que ve el cajero al escanear el QR) ---------- */
  .verif{border-radius:22px; padding:22px 20px; text-align:center; border:2px solid; margin-bottom:16px; position:relative; overflow:hidden}
  .verif.ok{background:linear-gradient(160deg,#5f9a1e,#2f5410); border-color:#b7f07a}
  .verif.no{background:linear-gradient(160deg,#b3261e,#6e1712); border-color:#ff9c95}
  .verif .icono{font-size:54px; line-height:1}
  .verif h1{margin:8px 0 4px; font-size:28px; font-weight:900; letter-spacing:.02em}
  .verif .quien{font-size:20px; font-weight:800; margin:4px 0}
  .verif .det{color:rgba(255,255,255,.85); font-size:15px; margin:6px 0 0; line-height:1.4}
  .verif .reloj{margin-top:14px; display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:99px; background:rgba(0,0,0,.25);
    font-variant-numeric:tabular-nums; font-weight:800; font-size:18px}
  .verif .reloj i{width:10px; height:10px; border-radius:50%; background:#fff; animation:latido 1s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.3; transform:scale(.6)}}
  .verif .nota{font-size:12px; color:rgba(255,255,255,.75); margin-top:10px}
  /* ---------- alta (el cliente se anota solo) ---------- */
  .alta{border-radius:22px; padding:20px 18px; background:var(--negro); border:1px solid rgba(118,184,42,.6); box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .alta img{display:block; width:62%; margin:0 auto 6px}
  .alta h1{margin:6px 0 4px; font-size:22px; text-align:center}
  .alta p.intro{margin:0 0 14px; color:var(--suave); text-align:center; font-size:14px; line-height:1.4}
  .alta label{display:block; font-size:13px; font-weight:700; color:var(--acento); margin:12px 0 6px}
  .alta input{width:100%; font:inherit; font-size:16px; color:#fff; background:#121211; border:1px solid var(--linea); border-radius:12px; padding:12px 14px}
  .alta input:focus{outline:2px solid var(--acento); border-color:transparent}
  .alta .fila2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .alta button{width:100%; margin-top:18px; font:inherit; font-size:17px; font-weight:800; color:#0f1f05; background:var(--acento); border:0; border-radius:14px; padding:14px; cursor:pointer}
  .alta .err{color:#ff9c95; font-size:13px; min-height:18px; margin-top:8px}
  .alta small{display:block; color:var(--suave); font-size:12px; margin-top:10px; text-align:center}
  .estado.pend{background:#fff; color:#1d1d1b}
  .otra{display:block; text-align:center; margin-top:14px; color:var(--suave); font-size:13px}
  @media (prefers-reduced-motion:reduce){.tarjeta::after,.estrellas .nueva{animation:none}.barra i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="marca">★ Club Bakano ★</div>
  <div id="verif"></div>
  <div id="app" class="tarjeta"><div class="aviso"><p>Cargando tu tarjeta…</p></div></div>
  <div id="extra"></div>
  <p class="pie">Bakano Minimarket · Belgrano 1264, Apóstoles<br><span id="act"></span></p>
</main>

  function dias(a, b){ return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  function aviso(titulo, texto){ app.innerHTML = '<div class="aviso"><h1>' + esc(titulo) + '</h1><p>' + texto + '</p></div>'; }
  function guardarToken(t){ try { localStorage.setItem('bakano_tarjeta', t); } catch (e) {} }
  function leerToken(){ try { return localStorage.getItem('bakano_tarjeta') || ''; } catch (e) { return ''; } }
  function qrSvg(texto){
    try { var q = qrcode(0, 'M'); q.addData(texto); q.make(); return q.createSvgTag({cellSize: 4, margin: 0, scalable: true}); }
    catch (e) { return ''; }
  }

  // #TOKEN → tarjeta del cliente · #TOKEN/v → verificación (lo abre el cajero al escanear el QR)
  var crudo = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  var verificar = /\/v$/i.test(crudo);
  if (/^(sumarme|alta|nueva)$/i.test(crudo)) { formulario(); return; }
  var token = crudo.replace(/\/v$/i, '') || (verificar ? '' : leerToken());
  if (!token) { formulario(); return; }
  if (!verificar && crudo !== token) { try { history.replaceState(null, '', '#' + token); } catch (e) {} }
  if (!(window.crypto && crypto.subtle)) { aviso('Club Bakano', 'Tu navegador es muy viejo para mostrar la tarjeta. Probá abrir el link en Chrome.'); return; }

  crypto.subtle.digest('SHA-256', new TextEncoder().encode(token)).then(function(buf){
    var h = Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('').slice(0, 20);
    return fetch('tarjetas.json?v=' + Date.now(), {cache: 'no-store'}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){ mostrar(data, data.t && data.t[h]); });
  }).catch(function(){ aviso('Club Bakano', 'No pude cargar la tarjeta. Revisá tu conexión y volvé a intentar en un ratito.'); });

  function leerAlta(){ try { return JSON.parse(localStorage.getItem('bakano_alta') || 'null'); } catch (e) { return null; } }
  function linkBot(p){ return 'https://t.me/' + BOT + '?start=' + p; }
  function b64url(txt){
    var bytes = new TextEncoder().encode(txt), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function payloadAlta(tok, a){
    // Telegram deja hasta 64 caracteres: si no entra, primero saco el Instagram y después acorto el nombre
    var nom = a.n, ig = a.ig || '', cum = a.c || '';
    for (var k = 0; k < 40; k++) {
      var p = 'a_' + tok + b64url(nom + '|' + cum + '|' + ig);
      if (p.length <= 64) return p;
      if (ig) { ig = ''; continue; }
      var partes = nom.split(' ');
      nom = partes.length > 1 && partes[partes.length - 1].length > 2 ? partes.slice(0, -1).join(' ') + ' ' + partes[partes.length - 1][0] : nom.slice(0, -1);
    }
    return 'a_' + tok + b64url(nom.slice(0, 10) + '||');
  }
  function nuevoToken(){
    var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', r = new Uint8Array(8), s = '';
    crypto.getRandomValues(r); for (var i = 0; i < 8; i++) s += abc[r[i] % abc.length]; return s;
  }
  function formulario(){
    app.className = ''; extra.innerHTML = '';
    var previo = leerToken();
    app.innerHTML = '<form class="alta" id="f" novalidate>' +
      '<img alt="Bakano Minimarket" src="' + LOGO + '">' +
      '<h1>Sumate al Club Bakano ⭐</h1>' +
      '<p class="intro">Reintegro en saldo en cada compra, promos exclusivas y regalo de cumple. Completá tus datos y listo: tu tarjeta queda en tu celular.</p>' +
      '<label for="n">Nombre y apellido</label><input id="n" autocomplete="name" maxlength="40" placeholder="Ej: Juan Pérez" required>' +
      '<div class="fila2"><div><label for="c">Cumple (día/mes)</label><input id="c" inputmode="numeric" maxlength="5" placeholder="12/05"></div>' +
      '<div><label for="i">Instagram</label><input id="i" autocapitalize="none" maxlength="30" placeholder="@usuario"></div></div>' +
      '<div class="err" id="err"></div>' +
      '<button type="submit">Crear mi tarjeta</button>' +
      '<small>Tu Instagram es para sumarte a «Mejores amigos» y ver las promos exclusivas.</small>' +
      '</form>' + (previo ? '<a class="otra" href="#' + esc(previo) + '">← Volver a mi tarjeta</a>' : '');
    var c = document.getElementById('c');
    c.addEventListener('input', function(){ var d = c.value.replace(/\D/g, '').slice(0, 4); c.value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; });
    document.getElementById('f').addEventListener('submit', function(ev){
      ev.preventDefault();
      var n = document.getElementById('n').value.replace(/[|]/g, ' ').replace(/\s+/g, ' ').trim();
      var cd = c.value.replace(/\D/g, ''), ig = document.getElementById('i').value.trim().replace(/^@/, '').replace(/[^\w.]/g, '');
      var err = document.getElementById('err');
      if (n.split(' ').length < 2 || n.length < 4) { err.textContent = 'Poné tu nombre y apellido.'; return; }
      if (cd && (cd.length !== 4 || +cd.slice(0, 2) < 1 || +cd.slice(0, 2) > 31 || +cd.slice(2) < 1 || +cd.slice(2) > 12)) { err.textContent = 'El cumple va como día/mes, por ejemplo 12/05.'; return; }
      var tok = nuevoToken();
      try {
        localStorage.setItem('bakano_alta', JSON.stringify({t: tok, n: n, c: cd, ig: ig}));
        localStorage.setItem('bakano_tarjeta', tok);
      } catch (e) {}
      location.hash = tok; location.reload();
    });
  }

  function plata(x){ return '$ ' + Math.round(+x || 0).toLocaleString('es-AR'); }
  function beneficios(R, black){
    var L = black ? R.beneficios_black : R.beneficios;
    if (Array.isArray(L) && L.length) return L;
    var b = [];
    if (R.reintegro) b.push(R.reintegro + '% de reintegro en saldo para tus próximas compras');
    b.push('Promos exclusivas en la historia de Mejores amigos');
    if (R.premio_cada) b.push(cap(R.premio || 'un regalo') + ' cada ' + R.premio_cada + ' compras');
    b.push('Regalo de cumple');
    b.push('Sorteo todos los meses entre los socios');
    return b;
  }

  function mostrar(data, s){
    var R = data.reglas || {}, meta = +R.estrellas || 5, cada = +R.premio_cada || 0;
    if (data.actualizado) act.textContent = 'Datos actualizados el ' + fecha(data.actualizado.slice(0, 10)) + ' a las ' + data.actualizado.slice(11, 16);
    var socio = !!s && s.ok === 'socio', n = s ? (+s.e || 0) : 0, hoy = hoyAR();

    if (verificar) { mostrarVerificacion(R, s, socio, n, meta); }
    var alta = leerAlta();
    if (!s && !verificar && alta && alta.t === token) { pendiente(R, meta, alta); return; }
    if (!s) { aviso('Tarjeta no encontrada', 'Si recién te sumaste, puede tardar unos minutos en aparecer. Si no, pedinos el link de nuevo.'); return; }
    if (!verificar) guardarToken(token);

    var quedan = socio && s.hasta ? Math.max(0, dias(hoy, s.hasta)) : 0;
    var vistas = 0;
    if (!verificar) { try { var kv = 'bakano_vistas_' + (s.desde || ''); vistas = +(localStorage.getItem(kv) || 0); localStorage.setItem(kv, n); } catch (e) {} }
    var est = '';
    for (var i = 0; i < meta; i++) est += '<span class="' + (i < n ? 'llena' : 'vacia') + (i < n && i >= vistas ? ' nueva' : '') + '" style="animation-delay:' + (i * 0.12) + 's">' + STAR + '</span>';
    var linkQR = linkBot('e_' + token);
    var black = socio && s.tipo === 'black';
    app.className = 'tarjeta ' + (black ? 'black' : 'green');

    app.innerHTML =
      '<div class="izq">' +
        '<img class="logo" alt="Bakano Minimarket" src="' + LOGO + '">' +
        '<div class="club">' + (black ? 'CLUB BAKANO · BLACK' : 'CLUB BAKANO · GREEN') + '</div>' +
        '<div class="nombre">' + esc(s.n) + '</div>' +
        '<span class="estado' + (socio ? '' : ' baja') + '">' + (socio ? (black ? 'SOCIO BLACK' : 'SOCIO GREEN') : 'FUERA DEL CLUB') + '</span>' +
        '<div class="estrellas" aria-label="' + n + ' de ' + meta + ' estrellas">' + est + '</div>' +
        '<div class="vence">' + (socio ? 'Saldo a favor <b class="sdo">' + plata(s.sd) + '</b> · ' + (black && s.bh ? 'Black hasta el ' + fecha(s.bh) : 'estrellas hasta el ' + fecha(s.hasta)) : (s.baja ? 'Salió del club el ' + fecha(s.baja) : '')) + '</div>' +
      '</div>' +
      '<div class="der"><div class="qr">' + qrSvg(linkQR) + '</div><div class="qr-txt">Mostralo al pagar</div></div>';

    var msg;
    if (!socio) msg = 'Este mes no llegaste a las ' + meta + ' ⭐. <b>¡Volvé cuando quieras!</b> Escribinos por Instagram y te sumamos de nuevo.';
    else if (n >= meta) msg = '<b>¡Juntaste tus ' + meta + ' estrellas!</b> Seguís en el club el mes que viene' + (s.hasta ? ' (desde el ' + fecha(s.hasta) + ')' : '') + '.' + (n > meta ? ' Y vas ' + (n - meta) + ' de yapa 🙌' : '');
    else {
      var f = meta - n;
      msg = 'Te ' + (f === 1 ? 'falta <b>1 estrella</b>' : 'faltan <b>' + f + ' estrellas</b>') + ' para seguir en el club' +
            (quedan ? ': tenés <b>' + quedan + (quedan === 1 ? ' día' : ' días') + '</b>.' : '.');
    }
    var pct = socio && s.desde && s.hasta ? Math.min(100, Math.max(0, 100 * dias(s.desde, hoy) / Math.max(1, dias(s.desde, s.hasta)))) : 0;
    var html = '<p class="mensaje">' + msg + '</p>';
    if (socio && s.desde) html += '<div class="barra"><i id="barra"></i></div><div class="plazo"><span>Empezó el ' + fecha(s.desde) + '</span><span>Cierra el ' + fecha(s.hasta) + '</span></div>';
    var umbral = +R.umbral_black || 0;
    if (socio) {
      html += '<section class="caja"><h2>💳 Tu saldo a favor</h2><div class="ahorro"><div class="grande">' + plata(s.sd) + '</div>' +
              '<span>para usar en tu próxima compra</span></div>' +
              '<p class="mini">Cada compra te devuelve el <b>' + esc(black ? (R.reintegro_black || 12) : (R.reintegro || 8)) + '%</b> en saldo. ' +
              'Para usarlo, avisale al cajero cuando pagás.</p></section>';
    }
    if (black) {
      html += '<section class="caja"><h2>🖤 Tu ahorro con la Black</h2><div class="ahorro"><div class="grande">' + plata(s.ah) + '</div>' +
              '<span>de reintegro ganado con la Black</span></div>' +
              '<p class="mini">Este mes: <b>' + plata(s.ahm) + '</b> · llevás <b>' + plata(s.g) + '</b> en compras</p>' +
              (umbral ? '<p class="mini">' + (+s.g >= umbral ? '✅ Ya superaste ' + plata(umbral) + ': <b>seguís en Black el mes que viene</b>.'
                       : 'Superá <b>' + plata(umbral) + '</b> este mes (te faltan ' + plata(umbral - s.g) + ') para seguir en Black.') + '</p>' : '') +
              '</section>' +
              '<section class="caja"><h2>🍰 Tu merienda de la semana</h2><p class="mini" style="margin:0">' +
              (s.mer ? '<b>Disponible</b>: pedila al pagar y mostrá tu tarjeta.' : 'Ya la usaste esta semana. <b>El lunes</b> tenés otra.') + '</p></section>';
    } else if (socio && umbral) {
      var pg = Math.min(100, 100 * (+s.g || 0) / umbral);
      html += '<section class="caja"><h2>🖤 Camino a la Black</h2>' +
              '<p class="mini" style="margin:0">Llevás <b>' + plata(s.g) + '</b> en compras este mes. ' +
              (+s.g >= umbral ? '<b>¡Pasaste a la Black!</b>' : 'Te faltan <b>' + plata(umbral - s.g) + '</b> para pasar a la tarjeta Black.') + '</p>' +
              '<div class="barra"><i id="barra2"></i></div>' +
              '<p class="mini">Con la Black: <b>' + esc(R.reintegro_black || 12) + '% de reintegro</b>, un café con 2 medialunas gratis por semana y súper regalo de cumple.</p></section>';
      setTimeout(function(){ var b2 = document.getElementById('barra2'); if (b2) b2.style.width = pg + '%'; }, 60);
    }
    if (socio && cada) {
      var faltan = cada - ((+s.c || 0) % cada);
      html += '<section class="caja"><h2>🎁 Tu próximo regalo</h2><div class="regalo"><div class="num">' + faltan + '</div>' +
              '<p>' + (faltan === 1 ? 'compra' : 'compras') + ' más y te llevás <b>' + esc(R.premio || 'un regalo') + '</b> de regalo.</p></div></section>';
    }
    html += '<section class="caja"><h2>Beneficios de tu tarjeta ' + (black ? 'Black' : 'Green') + '</h2><ul>' +
      beneficios(R, black).map(function(b){ return '<li><span class="pt">' + STAR + '</span><span>' + esc(cap(b)) + '</span></li>'; }).join('') + '</ul>' +
      '<p class="mini">El reintegro no incluye cigarrillos, importados ni alcohol caro.</p></section>' +
      '<section class="caja"><h2>¿Cómo sumo estrellas?</h2><ul>' +
      '<li><span>📷</span><span>Al pagar, <b>mostrá el QR</b> de tu tarjeta: el cajero lo escanea y sumás la compra y el reintegro.</span></li>' +
      '<li><span class="pt">' + STAR + '</span><span>Cada día que comprás' + (R.minimo_estrella ? ' desde <b>' + plata(R.minimo_estrella) + '</b>' : '') + ' sumás <b>1 estrella</b>.</span></li>' +
      '<li><span>📅</span><span>Juntá <b>' + meta + ' estrellas en ' + (R.dias || 30) + ' días</b> y seguís en el club otro mes.</span></li>' +
      '<li><span>📲</span><span>Guardá esta página en tu inicio para tenerla a mano.</span></li>' +
      '</ul></section>';
    extra.innerHTML = verificar ? '' : html;
    if (socio) setTimeout(function(){ var b = document.getElementById('barra'); if (b) b.style.width = pct + '%'; }, 60);
  }

  function pendiente(R, meta, a){
    app.className = 'tarjeta green';
    var est = '';
    for (var i = 0; i < meta; i++) est += '<span class="vacia">' + STAR + '</span>';
    app.innerHTML =
      '<div class="izq">' +
        '<img class="logo" alt="Bakano Minimarket" src="' + LOGO + '">' +
        '<div class="club">CLUB BAKANO · GREEN</div>' +
        '<div class="nombre">' + esc(a.n) + '</div>' +
        '<span class="estado pend">ACTIVALA EN TU PRÓXIMA COMPRA</span>' +
        '<div class="estrellas">' + est + '</div>' +
        '<div class="vence">Tu primera estrella llega cuando la activen</div>' +
      '</div>' +
      '<div class="der"><div class="qr">' + qrSvg(linkBot(payloadAlta(a.t, a))) + '</div><div class="qr-txt">Mostralo al pagar</div></div>';
    extra.innerHTML = '<p class="mensaje">¡Listo, <b>' + esc(a.n.split(' ')[0]) + '</b>! 🎉 Tu tarjeta ya está en este celular.</p>' +
      '<section class="caja"><h2>¿Cómo la activo?</h2><ul>' +
      '<li><span>📷</span><span>En tu próxima compra en Bakano, <b>mostrá este QR</b> al pagar. El cajero lo escanea y quedás adentro del club con tu primera estrella.</span></li>' +
      '<li><span>📲</span><span><b>Guardá esta página</b> en tu inicio (menú del navegador → «Agregar a pantalla de inicio») para tenerla a mano.</span></li>' +
      '</ul></section>' +
      '<section class="caja"><h2>Beneficios del club</h2><ul>' +
      beneficios(R).map(function(b){ return '<li><span class="pt">' + STAR + '</span><span>' + esc(cap(b)) + '</span></li>'; }).join('') + '</ul></section>' +
      '<a class="otra" href="#sumarme">¿Datos mal? Volver a anotarme</a>';
  }

  function mostrarVerificacion(R, s, socio, n, meta){
    document.title = 'Club Bakano · Verificación';
    var t = !s ? ['no', '⛔', 'TARJETA NO VÁLIDA', '', 'Este código no corresponde a ningún socio.']
          : socio ? ['ok', '✅', 'SOCIO ACTIVO', s.n, (R.reintegro ? 'Tiene <b>' + esc(R.reintegro) + '% de reintegro</b>. ' : '') + 'Estrellas del mes: ' + n + ' de ' + meta + '.']
          : ['no', '⛔', 'NO ES SOCIO', s.n, 'Salió del club' + (s.baja ? ' el ' + fecha(s.baja) : '') + '. No corresponde reintegro.'];
    verifBox.innerHTML = '<div class="verif ' + t[0] + '"><div class="icono">' + t[1] + '</div><h1>' + t[2] + '</h1>' +
      (t[3] ? '<div class="quien">' + esc(t[3]) + '</div>' : '') + '<p class="det">' + t[4] + '</p>' +
      '<div class="reloj"><i></i><span id="reloj"></span></div>' +
      '<p class="nota">El reloj tiene que estar andando: si está quieto, es una captura de pantalla.</p></div>';
    function tic(){ var d = new Date(); var el = document.getElementById('reloj');
      if (el) el.textContent = d.toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit'}) + ' · ' + d.toLocaleTimeString('es-AR', {hour12: false}); }
    tic(); setInterval(tic, 1000);
  }
})();
</script>
</body>
</html>
